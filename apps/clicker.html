
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Clicker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 24px;
            background: white;
            color: #333;
        }
        h1 {
            font-size: 28px;
        }
        p {
            line-height: 1.6;
        }
        .cat-button {
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer;
        }
        #catImage {
            display: block;
            width: 240px;
            height: 240px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <h1>Cat Clicker</h1>
    <button class="cat-button" onclick="incrementCount()"><img id="catImage" src="../assets/placeholder.png" alt="A cat"></button>
    <h3 id="count">Clicks</h3>
    <hr>
    <button onclick="purchaseYarn()">Buy YARN! 10 cats and gives you +1 cats per second!</button>
    <button onclick="purchaseMilk()">Buy MILK! 10 cats and gives you +5% cats, every second!</button>
</body>
<script>
    const catImages = [
        "../cats/1.jpg",
        "../cats/2.jpg",
        "../cats/3.jpg",
        "../cats/4.jpg",
        "../cats/5.jpg",
        "../cats/6.jpg",
        "../cats/7.jpg",
        "../cats/8.jpg",
        "../cats/9.jpg",
        "../cats/10.jpg"
    ];
    let clicks = 0;
    let yarnCount = 0;
    let milkCount = 0;
    let currentCatIndex = -1;

    function incrementCount() {
        clicks++;
        document.getElementById("count").textContent = Math.floor(clicks);

        let nextCatIndex = Math.floor(Math.random() * catImages.length);
        if (catImages.length > 1) {
            while (nextCatIndex === currentCatIndex) {
                nextCatIndex = Math.floor(Math.random() * catImages.length);
            }
        }
        currentCatIndex = nextCatIndex;
        document.getElementById("catImage").src = catImages[nextCatIndex];
    }

    function updateclicks() {
        clicks = clicks + (yarnCount / 10);
        clicks = clicks * (1 + (milkCount / 200));
        document.getElementById("count").textContent = (toString(floor(clicks)) + " cats");
    }

    function purchaseYarn() {
        if (clicks > 9.9) {
            clicks = clicks - 10
            yarnCount++;
        }
        else {
            alert("Not enough cats!")
        }
    }

    function purchaseMilk() {
        if (clicks > 9.9) {
            clicks = clicks - 10
            milkCount++;
        }
        else {
            alert("Not enough cats!")
        }
    }

    setInterval(updateclicks, 100)

</script>
</html>
